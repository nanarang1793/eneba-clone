# Runs on every push and pull request. A green check on GitHub means:
# the Go code is vetted, every backend test passed against a real Postgres
# (migrated + seeded exactly like production), and the frontend type-checks,
# passes its tests and builds.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eneba
          POSTGRES_PASSWORD: eneba
          POSTGRES_DB: eneba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eneba -d eneba"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://eneba:eneba@localhost:5432/eneba?sslmode=disable
      PGPASSWORD: eneba
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply migrations and load the seed
        run: |
          for f in migrations/*.up.sql; do
            psql -h localhost -U eneba -d eneba -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U eneba -d eneba -v ON_ERROR_STOP=1 -q -f seed/seed.sql
      - run: go vet ./...
      - run: go test ./... -count=1 -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # also type-checks (tsc -b)
